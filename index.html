<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RAYAN AI — Creative Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;
  --surface:#12121a;
  --surface2:#1a1a26;
  --border:#ffffff0f;
  --border2:#ffffff18;
  --accent:#7c3aed;
  --accent2:#a855f7;
  --accent-glow:#7c3aed40;
  --pink:#ec4899;
  --cyan:#06b6d4;
  --text:#f0f0f8;
  --text2:#9090b0;
  --text3:#505070;
  --radius:12px;
  --radius-lg:18px;
  --font-display:'Syne',sans-serif;
  --font-body:'Inter',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body)}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}

/* LAYOUT */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;min-width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0}
.workspace{flex:1;overflow-y:auto;padding:24px;display:flex;gap:20px}

/* SIDEBAR */
.logo{padding:20px 18px 16px;border-bottom:1px solid var(--border)}
.logo-text{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-0.5px}
.logo-text span{background:linear-gradient(135deg,var(--accent2),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-sub{font-size:10px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;margin-top:2px}

.nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.nav-section{font-size:10px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;padding:10px 8px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--text2);transition:all .15s;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent-glow);color:var(--accent2);font-weight:500}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.7}
.nav-item.active svg{opacity:1}

.api-box{margin:12px;padding:12px;background:var(--surface2);border-radius:var(--radius);border:1px solid var(--border)}
.api-box label{font-size:11px;color:var(--text3);letter-spacing:.5px;display:block;margin-bottom:6px}
.api-input{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:7px 10px;border-radius:7px;font-size:12px;font-family:var(--font-body);outline:none}
.api-input:focus{border-color:var(--accent)}
.api-status{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:11px;color:var(--text3)}
.api-dot{width:6px;height:6px;border-radius:50%;background:var(--text3)}
.api-dot.ok{background:#22c55e}

/* TOPBAR */
.tab-pills{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:9px}
.tab-pill{padding:5px 14px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--text2);transition:all .15s}
.tab-pill.active{background:var(--accent);color:#fff}
.topbar-title{font-family:var(--font-display);font-weight:700;font-size:15px;margin-right:auto}
.credits-badge{font-size:12px;color:var(--text2);padding:4px 10px;border:1px solid var(--border2);border-radius:99px}

/* PANELS */
.panel-left{width:300px;min-width:300px;display:flex;flex-direction:column;gap:16px}
.panel-right{flex:1;display:flex;flex-direction:column;gap:16px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px}
.card-title{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px}

/* FORM ELEMENTS */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field label{font-size:12px;color:var(--text2);font-weight:500}
textarea,input[type=text],select{width:100%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:10px 12px;border-radius:9px;font-size:13px;font-family:var(--font-body);outline:none;transition:border-color .15s;resize:none}
textarea:focus,input[type=text]:focus,select:focus{border-color:var(--accent)}
select option{background:var(--surface2)}
textarea{height:100px;line-height:1.5}

.row{display:flex;gap:10px}
.row .field{flex:1}

/* GENERATE BTN */
.gen-btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--accent),var(--pink));border:none;border-radius:10px;color:#fff;font-family:var(--font-display);font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.5px;transition:opacity .2s,transform .1s;display:flex;align-items:center;justify-content:center;gap:8px}
.gen-btn:hover{opacity:.9}
.gen-btn:active{transform:scale(.98)}
.gen-btn:disabled{opacity:.4;cursor:not-allowed}

/* UPLOAD ZONE */
.upload-zone{border:2px dashed var(--border2);border-radius:10px;padding:28px 16px;text-align:center;cursor:pointer;transition:all .2s;position:relative}
.upload-zone:hover{border-color:var(--accent);background:var(--accent-glow)}
.upload-zone.has-file{border-style:solid;border-color:var(--accent)}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload-icon{font-size:28px;margin-bottom:6px}
.upload-text{font-size:12px;color:var(--text2)}
.upload-preview{max-width:100%;max-height:120px;border-radius:8px;object-fit:contain;margin-top:8px}

/* OUTPUT AREA */
.output-area{flex:1;min-height:400px;background:var(--surface2);border-radius:var(--radius-lg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.output-empty{text-align:center;color:var(--text3)}
.output-empty .icon{font-size:48px;margin-bottom:12px;opacity:.3}
.output-empty p{font-size:13px}

.output-img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
.output-video{max-width:100%;max-height:100%;border-radius:10px}

/* PROGRESS */
.progress-wrap{position:absolute;inset:0;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.spinner{width:44px;height:44px;border:3px solid var(--border2);border-top-color:var(--accent2);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.progress-text{font-size:13px;color:var(--text2)}
.progress-stage{font-size:11px;color:var(--text3);margin-top:-8px}
.progress-bar-wrap{width:200px;height:3px;background:var(--border2);border-radius:99px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--pink));border-radius:99px;animation:progpulse 2s ease-in-out infinite}
@keyframes progpulse{0%{width:10%}50%{width:80%}100%{width:10%}}

/* ACTION BAR */
.action-bar{display:flex;gap:8px;padding:12px 0 0}
.action-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--border2);border-radius:8px;background:var(--surface2);color:var(--text2);font-size:12px;cursor:pointer;transition:all .15s;text-decoration:none}
.action-btn:hover{border-color:var(--accent);color:var(--accent2)}

/* HISTORY */
.history-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.history-thumb{aspect-ratio:1;background:var(--surface2);border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:border-color .15s;position:relative}
.history-thumb:hover{border-color:var(--accent)}
.history-thumb img,.history-thumb video{width:100%;height:100%;object-fit:cover}
.history-thumb .type-badge{position:absolute;top:4px;left:4px;font-size:9px;padding:2px 5px;border-radius:4px;background:#000a;color:#fff;text-transform:uppercase;letter-spacing:.5px}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:12px 18px;font-size:13px;color:var(--text);z-index:999;transform:translateY(100px);opacity:0;transition:all .3s;max-width:320px}
.toast.show{transform:translateY(0);opacity:1}
.toast.error{border-color:#ef4444;color:#fca5a5}
.toast.success{border-color:#22c55e;color:#86efac}

/* MODEL GRID */
.model-grid{display:flex;flex-direction:column;gap:4px;max-height:200px;overflow-y:auto}
.model-opt{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--text2);transition:all .12s;border:1px solid transparent}
.model-opt:hover{background:var(--surface2);color:var(--text)}
.model-opt.selected{background:var(--accent-glow);border-color:var(--accent);color:var(--accent2)}
.model-opt .badge{font-size:9px;padding:1px 5px;border-radius:4px;background:var(--border2);color:var(--text3);margin-left:auto;text-transform:uppercase;letter-spacing:.5px}
.model-opt.selected .badge{background:var(--accent);color:#fff}

/* RATIO PILLS */
.ratio-pills{display:flex;flex-wrap:wrap;gap:5px}
.ratio-pill{padding:4px 10px;border:1px solid var(--border2);border-radius:6px;font-size:11.5px;cursor:pointer;color:var(--text2);transition:all .12s}
.ratio-pill.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* SECTION TAG */
.section-tag{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text3);display:flex;align-items:center;gap:6px;margin-bottom:10px}
.section-tag::after{content:'';flex:1;height:1px;background:var(--border)}

/* STUDIO SWITCHER hidden panels */
.studio-panel{display:none}
.studio-panel.active{display:contents}

/* RESPONSIVE */
@media(max-width:900px){
  .sidebar{display:none}
  .panel-left{width:260px;min-width:260px}
}
@media(max-width:700px){
  .workspace{flex-direction:column}
  .panel-left{width:100%;min-width:unset}
}
</style>
</head>
<body>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-text">RAYAN <span>AI</span></div>
      <div class="logo-sub">Creative Studio</div>
    </div>
    <nav class="nav">
      <div class="nav-section">Studios</div>
      <button class="nav-item active" onclick="switchStudio('image')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21,15 16,10 5,21"/></svg>
        Image Studio
      </button>
      <button class="nav-item" onclick="switchStudio('video')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        Video Studio
      </button>
      <button class="nav-item" onclick="switchStudio('i2v')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        Image → Video
      </button>
      <div class="nav-section" style="margin-top:8px">History</div>
      <button class="nav-item" onclick="showHistory()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.75"/></svg>
        Recent Outputs
      </button>
    </nav>
    <div class="api-box">
      <label>MUAPI KEY</label>
      <input type="password" class="api-input" id="apiKeyInput" placeholder="mk-xxxxxxxxxx" oninput="saveKey(this.value)"/>
      <div class="api-status">
        <div class="api-dot" id="apiDot"></div>
        <span id="apiStatusText">Enter your key</span>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <!-- TOPBAR -->
    <div class="topbar">
      <div class="topbar-title" id="studioTitle">Image Studio</div>
      <div class="tab-pills">
        <button class="tab-pill active" id="tab-t2i" onclick="switchMode('t2i')">Text → Image</button>
        <button class="tab-pill" id="tab-i2i" onclick="switchMode('i2i')">Image → Image</button>
      </div>
    </div>

    <!-- WORKSPACE -->
    <div class="workspace" id="workspace">

      <!-- LEFT PANEL -->
      <div class="panel-left" id="leftPanel">

        <!-- MODEL SELECT -->
        <div class="card">
          <div class="card-title">Model</div>
          <input type="text" id="modelSearch" placeholder="Search models..." oninput="filterModels()" style="margin-bottom:10px"/>
          <div class="model-grid" id="modelGrid"></div>
        </div>

        <!-- PROMPT -->
        <div class="card">
          <div class="card-title">Prompt</div>
          <div class="field">
            <textarea id="promptInput" placeholder="Describe what you want to generate..."></textarea>
          </div>
          <div class="field" id="negativeField">
            <label>Negative Prompt</label>
            <textarea id="negativeInput" placeholder="What to avoid..." style="height:60px"></textarea>
          </div>
        </div>

        <!-- SETTINGS -->
        <div class="card" id="settingsCard">
          <div class="card-title">Settings</div>
          <div class="field">
            <label>Aspect Ratio</label>
            <div class="ratio-pills" id="ratioPills">
              <div class="ratio-pill active" onclick="setRatio(this,'1:1')">1:1</div>
              <div class="ratio-pill" onclick="setRatio(this,'16:9')">16:9</div>
              <div class="ratio-pill" onclick="setRatio(this,'9:16')">9:16</div>
              <div class="ratio-pill" onclick="setRatio(this,'4:3')">4:3</div>
              <div class="ratio-pill" onclick="setRatio(this,'3:4')">3:4</div>
              <div class="ratio-pill" onclick="setRatio(this,'21:9')">21:9</div>
            </div>
          </div>
          <!-- Video duration (hidden in image mode) -->
          <div class="field" id="durationField" style="display:none">
            <label>Duration</label>
            <div class="ratio-pills">
              <div class="ratio-pill active" onclick="setDuration(this,'5')">5s</div>
              <div class="ratio-pill" onclick="setDuration(this,'8')">8s</div>
              <div class="ratio-pill" onclick="setDuration(this,'10')">10s</div>
            </div>
          </div>
          <!-- Upload (for i2i/i2v modes) -->
          <div class="field" id="uploadField" style="display:none">
            <label id="uploadLabel">Source Image</label>
            <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
              <input type="file" id="fileInput" accept="image/*,video/*" style="display:none" onchange="handleFileUpload(this)"/>
              <div class="upload-icon">📁</div>
              <div class="upload-text">Click to upload</div>
              <img id="uploadPreview" class="upload-preview" style="display:none"/>
            </div>
          </div>
        </div>

        <button class="gen-btn" id="genBtn" onclick="generate()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          Generate
        </button>
      </div>

      <!-- RIGHT PANEL -->
      <div class="panel-right">
        <!-- OUTPUT -->
        <div class="output-area" id="outputArea">
          <div class="output-empty" id="outputEmpty">
            <div class="icon">✨</div>
            <p>Your generation will appear here</p>
          </div>
          <div class="progress-wrap" id="progressWrap" style="display:none">
            <div class="spinner"></div>
            <div class="progress-text" id="progressText">Generating...</div>
            <div class="progress-stage" id="progressStage">Submitting request</div>
            <div class="progress-bar-wrap"><div class="progress-bar"></div></div>
          </div>
        </div>

        <!-- ACTION BAR -->
        <div class="action-bar" id="actionBar" style="display:none">
          <a class="action-btn" id="downloadBtn" href="#" download="rayan-ai-output">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download
          </a>
          <button class="action-btn" onclick="useAsInput()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.75"/></svg>
            Use as Input
          </button>
          <button class="action-btn" onclick="copyUrl()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy URL
          </button>
        </div>

        <!-- HISTORY -->
        <div class="card" id="historyCard" style="display:none">
          <div class="card-title">Recent Outputs</div>
          <div class="history-grid" id="historyGrid"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ─── STATE ───────────────────────────────────────────
const STATE = {
  studio: 'image',  // image | video | i2v
  mode: 't2i',      // t2i | i2i
  model: null,
  ratio: '1:1',
  duration: '5',
  uploadedUrl: null,
  uploadedFile: null,
  outputUrl: null,
  outputType: null, // image | video
  history: JSON.parse(localStorage.getItem('rayan_history') || '[]'),
};

// ─── MODELS DATA ─────────────────────────────────────
const MODELS = {
  image: [
    {id:'flux-dev', name:'Flux Dev', badge:'Popular'},
    {id:'flux-schnell', name:'Flux Schnell', badge:'Fast'},
    {id:'flux-kontext-pro-t2i', name:'Flux Kontext Pro', badge:'Pro'},
    {id:'flux-kontext-max-t2i', name:'Flux Kontext Max', badge:'Max'},
    {id:'gpt4o-text-to-image', name:'GPT-4o Image', badge:'OpenAI'},
    {id:'midjourney-v7-text-to-image', name:'Midjourney v7', badge:'MJ'},
    {id:'nano-banana', name:'Nano Banana', badge:''},
    {id:'hidream-i1-fast', name:'HiDream i1 Fast', badge:'Fast'},
    {id:'hidream-i1-full', name:'HiDream i1 Full', badge:''},
    {id:'bytedance-seedream-v3', name:'Seedream v3', badge:'ByteDance'},
    {id:'wan2.6-text-to-image', name:'Wan 2.6', badge:''},
    {id:'hunyuan-image-3.0', name:'Hunyuan 3.0', badge:''},
    {id:'minimax-image-01', name:'Minimax Image', badge:''},
    {id:'kling-o1-text-to-image', name:'Kling O1', badge:''},
  ],
  i2i: [
    {id:'flux-kontext-dev-i2i', name:'Flux Kontext Dev', badge:''},
    {id:'flux-kontext-pro-i2i', name:'Flux Kontext Pro', badge:'Pro'},
    {id:'flux-kontext-max-i2i', name:'Flux Kontext Max', badge:'Max'},
    {id:'nano-banana', name:'Nano Banana', badge:''},
    {id:'wan2.6-image-to-image', name:'Wan 2.6 I2I', badge:''},
  ],
  video: [
    {id:'kling-v3.0-pro-text-to-video', name:'Kling v3.0 Pro', badge:'Top'},
    {id:'kling-v3.0-standard-text-to-video', name:'Kling v3.0 Std', badge:''},
    {id:'kling-v2.6-pro-t2v', name:'Kling v2.6 Pro', badge:''},
    {id:'veo3.1-text-to-video', name:'Veo 3.1', badge:'Google'},
    {id:'veo3.1-fast-text-to-video', name:'Veo 3.1 Fast', badge:'Fast'},
    {id:'veo3.1-lite-text-to-video', name:'Veo 3.1 Lite', badge:'Lite'},
    {id:'seedance-v2.0-t2v', name:'Seedance v2.0', badge:'ByteDance'},
    {id:'seedance-pro-t2v', name:'Seedance Pro', badge:''},
    {id:'seedance-lite-t2v', name:'Seedance Lite', badge:'Fast'},
    {id:'wan2.6-text-to-video', name:'Wan 2.6', badge:''},
    {id:'wan2.5-text-to-video', name:'Wan 2.5', badge:''},
    {id:'hunyuan-text-to-video', name:'Hunyuan Video', badge:''},
    {id:'minimax-hailuo-2.3-pro-t2v', name:'Hailuo 2.3 Pro', badge:''},
    {id:'runway-text-to-video', name:'Runway Gen', badge:''},
    {id:'openai-sora-2-text-to-video', name:'Sora 2', badge:'OpenAI'},
  ],
  i2v: [
    {id:'kling-v3.0-pro-image-to-video', name:'Kling v3.0 Pro', badge:'Top'},
    {id:'kling-v2.6-pro-i2v', name:'Kling v2.6 Pro', badge:''},
    {id:'wan2.6-image-to-video', name:'Wan 2.6 I2V', badge:''},
    {id:'wan2.5-image-to-video', name:'Wan 2.5 I2V', badge:''},
    {id:'hunyuan-image-to-video', name:'Hunyuan I2V', badge:''},
    {id:'seedance-pro-i2v', name:'Seedance Pro I2V', badge:''},
    {id:'minimax-hailuo-02-pro-i2v', name:'Hailuo 2 Pro I2V', badge:''},
  ]
};

const API_BASE = 'https://api.muapi.ai';

// ─── INIT ─────────────────────────────────────────────
function init() {
  const savedKey = localStorage.getItem('rayan_muapi_key');
  if (savedKey) {
    document.getElementById('apiKeyInput').value = savedKey;
    updateApiStatus(true);
  }
  renderModels();
  renderHistory();
}

// ─── API KEY ──────────────────────────────────────────
function saveKey(val) {
  localStorage.setItem('rayan_muapi_key', val);
  updateApiStatus(!!val.trim());
}
function getKey() {
  return localStorage.getItem('rayan_muapi_key') || '';
}
function updateApiStatus(ok) {
  document.getElementById('apiDot').className = 'api-dot' + (ok ? ' ok' : '');
  document.getElementById('apiStatusText').textContent = ok ? 'Key saved' : 'Enter your key';
}

// ─── STUDIO SWITCHING ─────────────────────────────────
function switchStudio(studio) {
  STATE.studio = studio;
  STATE.model = null;
  STATE.mode = studio === 'i2v' ? 'i2v' : 't2i';

  // Nav items
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  event.currentTarget.classList.add('active');

  // Update topbar
  const titles = {image:'Image Studio', video:'Video Studio', i2i:'Image → Video'};
  document.getElementById('studioTitle').textContent = studio === 'i2v' ? 'Image → Video' : (studio === 'video' ? 'Video Studio' : 'Image Studio');

  // Tab pills
  const tabWrap = document.querySelector('.tab-pills');
  if (studio === 'video') {
    tabWrap.style.display = 'none';
  } else if (studio === 'i2v') {
    tabWrap.style.display = 'none';
  } else {
    tabWrap.style.display = 'flex';
    document.getElementById('tab-t2i').textContent = 'Text → Image';
    document.getElementById('tab-i2i').textContent = 'Image → Image';
  }

  updatePanels();
  renderModels();
  resetOutput();
}

function switchMode(mode) {
  STATE.mode = mode;
  document.querySelectorAll('.tab-pill').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + mode).classList.add('active');
  updatePanels();
  renderModels();
}

function updatePanels() {
  const isVideo = STATE.studio === 'video';
  const isI2V = STATE.studio === 'i2v';
  const isI2I = STATE.mode === 'i2i';
  const needsUpload = isI2I || isI2V;

  document.getElementById('durationField').style.display = (isVideo || isI2V) ? '' : 'none';
  document.getElementById('uploadField').style.display = needsUpload ? '' : 'none';
  document.getElementById('negativeField').style.display = isVideo ? 'none' : '';

  if (isI2V) document.getElementById('uploadLabel').textContent = 'Start Frame Image';
  if (isI2I) document.getElementById('uploadLabel').textContent = 'Source Image';
}

// ─── MODELS ──────────────────────────────────────────
function getModelList() {
  if (STATE.studio === 'video') return MODELS.video;
  if (STATE.studio === 'i2v') return MODELS.i2v;
  if (STATE.mode === 'i2i') return MODELS.i2i;
  return MODELS.image;
}

function renderModels(filter = '') {
  const list = getModelList();
  const filtered = filter ? list.filter(m => m.name.toLowerCase().includes(filter.toLowerCase())) : list;
  const grid = document.getElementById('modelGrid');
  grid.innerHTML = filtered.map(m => `
    <div class="model-opt ${STATE.model === m.id ? 'selected' : ''}" onclick="selectModel('${m.id}')">
      ${m.name}
      ${m.badge ? `<span class="badge">${m.badge}</span>` : ''}
    </div>
  `).join('');
  if (!STATE.model && filtered.length) {
    selectModel(filtered[0].id, true);
  }
}

function selectModel(id, silent = false) {
  STATE.model = id;
  document.querySelectorAll('.model-opt').forEach(el => {
    el.classList.toggle('selected', el.onclick.toString().includes(`'${id}'`));
  });
  // re-render to highlight
  renderModels(document.getElementById('modelSearch').value);
}

function filterModels() {
  renderModels(document.getElementById('modelSearch').value);
}

// ─── SETTINGS ────────────────────────────────────────
function setRatio(el, val) {
  STATE.ratio = val;
  document.querySelectorAll('.ratio-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
}
function setDuration(el, val) {
  STATE.duration = val;
  el.closest('.ratio-pills').querySelectorAll('.ratio-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
}

// ─── FILE UPLOAD ─────────────────────────────────────
function handleFileUpload(input) {
  const file = input.files[0];
  if (!file) return;
  STATE.uploadedFile = file;
  const reader = new FileReader();
  reader.onload = e => {
    const prev = document.getElementById('uploadPreview');
    prev.src = e.target.result;
    prev.style.display = 'block';
    document.querySelector('.upload-icon').style.display = 'none';
    document.querySelector('.upload-text').style.display = 'none';
    document.getElementById('uploadZone').classList.add('has-file');
  };
  reader.readAsDataURL(file);
}

// ─── GENERATE ────────────────────────────────────────
async function generate() {
  const key = getKey();
  if (!key) { toast('Enter your MUAPI key first', 'error'); return; }
  if (!STATE.model) { toast('Select a model', 'error'); return; }
  const prompt = document.getElementById('promptInput').value.trim();
  if (!prompt && STATE.studio !== 'i2v') { toast('Enter a prompt', 'error'); return; }

  const isVideo = STATE.studio === 'video';
  const isI2V = STATE.studio === 'i2v';
  const isI2I = STATE.mode === 'i2i';
  const needsUpload = isI2I || isI2V;

  if (needsUpload && !STATE.uploadedFile) { toast('Upload an image first', 'error'); return; }

  showProgress(true, isVideo || isI2V ? 'Generating video...' : 'Generating image...');
  document.getElementById('genBtn').disabled = true;
  resetOutput(false);

  try {
    let uploadedUrl = null;
    if (needsUpload && STATE.uploadedFile) {
      setProgressStage('Uploading image...');
      uploadedUrl = await uploadFile(STATE.uploadedFile, key);
    }

    setProgressStage('Submitting to model...');

    let result;
    if (isI2V) {
      result = await callVideoAPI(STATE.model, prompt, key, uploadedUrl, 'i2v');
    } else if (isVideo) {
      result = await callVideoAPI(STATE.model, prompt, key, null, 't2v');
    } else if (isI2I) {
      result = await callImageAPI(STATE.model, prompt, key, uploadedUrl, 'i2i');
    } else {
      result = await callImageAPI(STATE.model, prompt, key, null, 't2i');
    }

    const url = result.outputs?.[0] || result.url || result.output?.url;
    if (!url) throw new Error('No output URL in response');

    STATE.outputUrl = url;
    STATE.outputType = (isVideo || isI2V) ? 'video' : 'image';
    showOutput(url, STATE.outputType);
    saveHistory(url, STATE.outputType, prompt);
    toast('Generated successfully!', 'success');

  } catch (err) {
    console.error(err);
    toast(err.message || 'Generation failed', 'error');
    showProgress(false);
  } finally {
    document.getElementById('genBtn').disabled = false;
  }
}

async function uploadFile(file, key) {
  const form = new FormData();
  form.append('file', file);
  const res = await fetch(`${API_BASE}/api/v1/upload_file`, {
    method: 'POST',
    headers: { 'x-api-key': key },
    body: form
  });
  if (!res.ok) throw new Error(`Upload failed: ${res.status}`);
  const d = await res.json();
  return d.url || d.file_url || d.data?.url;
}

async function callImageAPI(model, prompt, key, imageUrl, mode) {
  const payload = { prompt, aspect_ratio: STATE.ratio };
  if (mode === 'i2i' && imageUrl) payload.image_url = imageUrl;

  const endpoint = mode === 'i2i' ? model : model;
  const res = await fetch(`${API_BASE}/api/v1/${endpoint}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': key },
    body: JSON.stringify(payload)
  });
  if (!res.ok) {
    const t = await res.text();
    throw new Error(`API error ${res.status}: ${t.slice(0, 120)}`);
  }
  const sub = await res.json();
  const rid = sub.request_id || sub.id;
  if (!rid) return sub;
  setProgressStage('Processing...');
  return await poll(rid, key);
}

async function callVideoAPI(model, prompt, key, imageUrl, mode) {
  const payload = {};
  if (prompt) payload.prompt = prompt;
  payload.aspect_ratio = STATE.ratio;
  payload.duration = STATE.duration;
  if (mode === 'i2v' && imageUrl) payload.image_url = imageUrl;

  const res = await fetch(`${API_BASE}/api/v1/${model}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': key },
    body: JSON.stringify(payload)
  });
  if (!res.ok) {
    const t = await res.text();
    throw new Error(`API error ${res.status}: ${t.slice(0, 120)}`);
  }
  const sub = await res.json();
  const rid = sub.request_id || sub.id;
  if (!rid) return sub;
  setProgressStage('Rendering video (this takes a few minutes)...');
  return await poll(rid, key, 900, 3000);
}

async function poll(rid, key, max = 120, interval = 2000) {
  for (let i = 0; i < max; i++) {
    await sleep(interval);
    const res = await fetch(`${API_BASE}/api/v1/predictions/${rid}/result`, {
      headers: { 'x-api-key': key }
    });
    if (!res.ok) continue;
    const d = await res.json();
    const s = (d.status || '').toLowerCase();
    if (['completed','succeeded','success'].includes(s)) return d;
    if (['failed','error'].includes(s)) throw new Error(d.error || 'Generation failed');
  }
  throw new Error('Timed out waiting for result');
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

// ─── OUTPUT ───────────────────────────────────────────
function showOutput(url, type) {
  showProgress(false);
  document.getElementById('outputEmpty').style.display = 'none';
  const area = document.getElementById('outputArea');

  // Remove old output
  area.querySelectorAll('.output-img,.output-video').forEach(el => el.remove());

  if (type === 'video') {
    const v = document.createElement('video');
    v.src = url;
    v.controls = true;
    v.autoplay = true;
    v.className = 'output-video';
    area.appendChild(v);
    document.getElementById('downloadBtn').href = url;
    document.getElementById('downloadBtn').download = 'rayan-ai-video.mp4';
  } else {
    const img = document.createElement('img');
    img.src = url;
    img.className = 'output-img';
    area.appendChild(img);
    document.getElementById('downloadBtn').href = url;
    document.getElementById('downloadBtn').download = 'rayan-ai-image.jpg';
  }
  document.getElementById('actionBar').style.display = 'flex';
}

function resetOutput(clearOutput = true) {
  if (clearOutput) {
    STATE.outputUrl = null;
    document.getElementById('outputEmpty').style.display = '';
    document.getElementById('actionBar').style.display = 'none';
    document.getElementById('outputArea').querySelectorAll('.output-img,.output-video').forEach(el => el.remove());
  }
}

function showProgress(show, text = 'Generating...') {
  document.getElementById('progressWrap').style.display = show ? 'flex' : 'none';
  document.getElementById('progressText').textContent = text;
  if (!show) document.getElementById('progressStage').textContent = '';
}
function setProgressStage(t) {
  document.getElementById('progressStage').textContent = t;
}

// ─── ACTIONS ─────────────────────────────────────────
function useAsInput() {
  if (!STATE.outputUrl) return;
  // Switch to i2i or i2v and set image
  if (STATE.studio === 'video') {
    switchStudio('i2v');
  } else {
    switchMode('i2i');
  }
  // Set as upload preview
  const prev = document.getElementById('uploadPreview');
  prev.src = STATE.outputUrl;
  prev.style.display = 'block';
  // We can't set it as File, but we store URL for direct use
  STATE.uploadedFile = null;
  STATE._directUploadUrl = STATE.outputUrl;
  toast('Output set as input', 'success');
}

function copyUrl() {
  if (!STATE.outputUrl) return;
  navigator.clipboard.writeText(STATE.outputUrl).then(() => toast('URL copied!', 'success'));
}

// ─── HISTORY ─────────────────────────────────────────
function saveHistory(url, type, prompt) {
  STATE.history.unshift({ url, type, prompt, ts: Date.now() });
  STATE.history = STATE.history.slice(0, 18);
  localStorage.setItem('rayan_history', JSON.stringify(STATE.history));
  renderHistory();
}

function renderHistory() {
  const grid = document.getElementById('historyGrid');
  if (!STATE.history.length) return;
  grid.innerHTML = STATE.history.map(item => `
    <div class="history-thumb" onclick="loadFromHistory('${item.url}','${item.type}')">
      <span class="type-badge">${item.type}</span>
      ${item.type === 'video'
        ? `<video src="${item.url}" muted></video>`
        : `<img src="${item.url}" loading="lazy"/>`}
    </div>
  `).join('');
}

function showHistory() {
  const card = document.getElementById('historyCard');
  card.style.display = card.style.display === 'none' ? '' : 'none';
}

function loadFromHistory(url, type) {
  STATE.outputUrl = url;
  STATE.outputType = type;
  showOutput(url, type);
}

// ─── TOAST ───────────────────────────────────────────
let toastTimer;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

// ─── START ────────────────────────────────────────────
init();
</script>
